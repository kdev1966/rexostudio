license:
  code: Apache-2.0
  weights: Apache-2.0      # Small variant only (Base/Large are CC-BY-NC-4.0)
  commercial: true
io:
  input:
    name: pixel_values
    size: 518              # square input, any multiple of 14 works
    layout: nchw_rgb_float
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  output:
    name: predicted_depth
    kind: disparity        # larger = closer
notes: >
  FP32 retained over INT8: on the reference CPU (Haswell, no VNNI) INT8 is not faster
  (598 ms vs 694 ms at 518x518, ADR 0003). About 0.6 s per panel, 420 MB peak RAM.
